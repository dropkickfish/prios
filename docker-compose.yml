services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - prios-data:/data
    environment:
      - DATABASE_URL=/data/sqlite.db
      - PUBLIC_DIR=/app/client/dist
      - STORAGE_LOCAL_PATH=/data/uploads

      # ── Authentication ────────────────────────────────────────────────────
      # Remove the leading # from AUTH_ENABLED and AUTH_SECRET to lock the app
      # down. Generate AUTH_SECRET with: openssl rand -hex 32
      # - AUTH_ENABLED=true
      # - AUTH_SECRET=replace-with-openssl-rand-hex-32
      # - AUTH_ALLOWED_EMAIL=you@example.com

      # OAuth provider — enable at least one when AUTH_ENABLED=true.
      # Redirect URIs must match what you register with the provider.

      # Google Login:
      # - AUTH_GOOGLE_CLIENT_ID=
      # - AUTH_GOOGLE_CLIENT_SECRET=
      # - AUTH_GOOGLE_REDIRECT_URI=https://prios.example.com/api/auth/google/callback

      # GitHub Login:
      # - AUTH_GITHUB_CLIENT_ID=
      # - AUTH_GITHUB_CLIENT_SECRET=
      # - AUTH_GITHUB_REDIRECT_URI=https://prios.example.com/api/auth/github/callback

      # Generic OIDC (Authentik, Keycloak, etc.):
      # - AUTH_OIDC_CLIENT_ID=
      # - AUTH_OIDC_CLIENT_SECRET=
      # - AUTH_OIDC_DISCOVERY_URL=https://auth.example.com/application/o/prios/.well-known/openid-configuration
      # - AUTH_OIDC_REDIRECT_URI=https://prios.example.com/api/auth/oidc/callback
      # - AUTH_OIDC_DISPLAY_NAME=Authentik

      # Trusted reverse proxy IPs (comma-separated IPs/CIDRs).
      # Set if running behind oauth2-proxy on a different host so forwarded
      # identity headers are accepted.
      # - TRUSTED_PROXIES=

      # ── Google Calendar (optional, separate from login) ───────────────────
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - GOOGLE_REDIRECT_URI=https://prios.example.com/api/auth/google-calendar/callback

      # ── S3-compatible storage (optional) ─────────────────────────────────
      # - STORAGE_TYPE=s3
      # - S3_BUCKET=
      # - S3_REGION=
      # - S3_ENDPOINT=
      # - S3_ACCESS_KEY_ID=
      # - S3_SECRET_ACCESS_KEY=

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prios-data:
